<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 24 24"
     width="24"
     height="24"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-labelledby="mcp-title mcp-desc">
  <title id="mcp-title">Model Context Protocol</title>
  <desc id="mcp-desc">Model Context Protocol official vector mark rendered as a solid high-contrast cobalt silhouette with an offset marker shadow.</desc>

  <metadata>
    <hw:metadata xmlns:hw="https://hyperweave.app/hw/v1.0">
      <hw:artifactType>inline-action-glyph</hw:artifactType>
      <hw:chromaticSystem>hand-drawn-cobalt-high-contrast</hw:chromaticSystem>
      <hw:geometryFormLanguage>monolithic-interlocking-link</hw:geometryFormLanguage>
      <hw:reasoning>
        <hw:intent>Restore instant legibility of the official MCP logo at 20px inline heading scale while maintaining tactile riso aesthetics in dark mode.</hw:intent>
        <hw:approach>Stripped the perimeter stroke that caused dual-line railroad artifacting. Rendered the interlocking loops as a solid, high-luminance silhouette with an offset tactile marker underlay.</hw:approach>
        <hw:tradeoffs>Avoided perimeter stroking on compound area paths; depth and tactile energy are achieved purely through offset registration and stepped micro-motion.</hw:tradeoffs>
      </hw:reasoning>
    </hw:metadata>
  </metadata>

  <style>
    :root {
      --hw-cobalt: #1D4ED8;
      --hw-sketch: rgba(29, 78, 216, 0.18);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --hw-cobalt: #38BDF8;
        --hw-sketch: rgba(56, 189, 248, 0.28);
      }
    }

    .mcp-group {
      transform-origin: 12px 12px;
      animation: mcp-pulse 2.5s steps(2, start) infinite alternate;
    }

    .sketch-bg {
      fill: var(--hw-sketch);
    }

    .mcp-glyph {
      fill: var(--hw-cobalt);
    }

    @keyframes mcp-pulse {
      0% {
        opacity: 0.90;
        transform: scale(0.98);
      }
      100% {
        opacity: 1;
        transform: scale(1.02);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .mcp-group {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }

    @media (forced-colors: active) {
      .sketch-bg {
        display: none;
      }
      .mcp-glyph {
        fill: SelectedItem;
      }
    }
  </style>

  <g class="mcp-group">
    <!-- Offset Tactile Riso Underlay -->
    <path class="sketch-bg"
