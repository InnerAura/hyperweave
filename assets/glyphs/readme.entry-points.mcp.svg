<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 24 24"
     width="24"
     height="24"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-labelledby="mcp-title mcp-desc">
  <title id="mcp-title">Model Context Protocol</title>
  <desc id="mcp-desc">Model Context Protocol official vector mark transformed into hand-drawn marker-cobalt aesthetic with CIM-compliant micro-motion.</desc>

  <metadata>
    <hw:metadata xmlns:hw="https://hyperweave.app/hw/v1.0">
      <hw:artifactType>inline-action-glyph</hw:artifactType>
      <hw:chromaticSystem>excalidraw-marker-cobalt</hw:chromaticSystem>
      <hw:geometryFormLanguage>monolithic-interlocking-link</hw:geometryFormLanguage>
      <hw:reasoning>
        <hw:intent>Apply HyperWeave's hand-drawn marker-cobalt DNA to the official MCP brand mark while preserving 100% of its native coordinate geometry.</hw:intent>
        <hw:approach>Mapped the compound path to an inked outline with cobalt fill. Transferred CSS tokens for adaptive light/dark switching and stepped cursor micro-motion.</hw:approach>
        <hw:tradeoffs>Kept path geometry strictly untouched, transferring aesthetic purely through stroke weights, round caps/joins, and chromatic variables.</hw:tradeoffs>
      </hw:reasoning>
    </hw:metadata>
  </metadata>

  <style>
    :root {
      --hw-paper: #FFFFFF;
      --hw-ink: #1B1B1D;
      --hw-cobalt: #1D4ED8;
      --hw-sketch: rgba(29, 78, 216, 0.06);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --hw-paper: #0F172A;
        --hw-ink: #F8FAFC;
        --hw-cobalt: #60A5FA;
        --hw-sketch: rgba(96, 165, 250, 0.12);
      }
    }

    .mcp-glyph {
      fill: var(--hw-cobalt);
      stroke: var(--hw-ink);
      stroke-width: 0.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      transform-origin: 12px 12px;
      animation: mcp-pulse 2s steps(2, start) infinite alternate;
      transition: fill 0.2s ease, stroke 0.2s ease;
    }

    @keyframes mcp-pulse {
      0% {
        opacity: 0.88;
        transform: scale(0.98);
      }
      100% {
        opacity: 1;
        transform: scale(1.02);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .mcp-glyph {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }

    @media (forced-colors: active) {
      .mcp-glyph {
        fill: CanvasText;
        stroke: Canvas;
      }
    }
  </style>

  <!-- Preserved Structure with Transferred Style Substrate -->
  <path class="mcp-glyph"
        d="M13.85 0a4.16 4.16 0 0 0-2.95 1.217L1.456 10.66a.835.835 0 0 0 0 1.18.835.835 0 0 0 1.18 0l9.442-9.442a2.49 2.49 0 0 1 3.541 0 2.49 2.49 0 0 1 0 3.541L8.59 12.97l-.1.1a.835.835 0 0 0 0 1.18.835.835 0 0 0 1.18 0l.1-.098 7.03-7.034a2.49 2.49 0 0 1 3.542 0l.049.05a2.49 2.49 0 0 1 0 3.54l-8.54 8.54a1.96 1.96 0 0 0 0 2.755l1.753 1.753a.835.835 0 0 0 1.18 0 .835.835 0 0 0 0-1.18l-1.753-1.753a.266.266 0 0 1 0-.394l8.54-8.54a4.185 4.185 0 0 0 0-5.9l-.05-.05a4.16 4.16 0 0 0-2.95-1.218c-.2 0-.401.02-.6.048a4.17 4.17 0 0 0-1.17-3.552A4.16 4.16 0 0 0 13.85 0m0 3.333a.84.84 0 0 0-.59.245L6.275 10.56a4.186 4.186 0 0 0 0 5.902 4.186 4.186 0 0 0 5.902 0L19.16 9.48a.835.835 0 0 0 0-1.18.835.835 0 0 0-1.18 0l-6.985 6.984a2.49 2.49 0 0 1-3.54 0 2.49 2.49 0 0 1 0-3.54l6.983-6.985a.835.835 0 0 0 0-1.18.84.84 0 0 0-.59-.245" />
</svg>
