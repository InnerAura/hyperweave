<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512"
     height="512"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-labelledby="open-cobalt-title open-cobalt-desc">
  <title id="open-cobalt-title">Hand-Drawn Open Sign — Marker Cobalt</title>
  <desc id="open-cobalt-desc">Adaptive architectural sketch of a suspended hand-drawn open sign rendered in high-contrast obsidian and cobalt with harmonic pendulum oscillation.</desc>

  <metadata>
    <hw:metadata xmlns:hw="https://hyperweave.app/hw/v1.0">
      <hw:artifactType>signage-illustration</hw:artifactType>
      <hw:chromaticSystem>hand-drawn-cobalt-high-contrast</hw:chromaticSystem>
      <hw:geometryFormLanguage>hand-drawn-organic-contour</hw:geometryFormLanguage>
      <hw:reasoning>
        <hw:intent>Deliver an authoritative, high-contrast architectural suspended open sign optimized for dark viewports.</hw:intent>
        <hw:approach>Shifted inner signboard face to obsidian (#070B14) with chalk-white lettering (#FFFFFF) and a vibrant royal cobalt chassis (#2563EB) accented by an offset riso drop-shadow. Stripped all CSS fill/stroke transitions to enforce strict CIM compliance.</hw:approach>
        <hw:tradeoffs>Preserved organic vertex wobble while removing color transitions in favor of single-pivot transform-only pendulum motion.</hw:tradeoffs>
      </hw:reasoning>
    </hw:metadata>
  </metadata>

  <style>
    :root {
      --hw-paper: #FFFFFF;
      --hw-ink: #0F172A;
      --hw-cobalt: #1D4ED8;
      --hw-cobalt-frame: #2563EB;
      --hw-sketch: rgba(29, 78, 216, 0.14);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --hw-paper: #070B14;
        --hw-ink: #FFFFFF;
        --hw-cobalt: #38BDF8;
        --hw-cobalt-frame: #1D4ED8;
        --hw-sketch: rgba(56, 189, 248, 0.28);
      }
    }

    /* Pendulum Rig (CIM: transform-only) */
    .suspension-rig {
      transform-origin: 256px 62px;
      animation: sign-sway 6s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite alternate;
    }

    .peg-node {
      fill: var(--hw-cobalt);
      stroke: var(--hw-ink);
      stroke-width: 12;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .cord-line {
      fill: none;
      stroke: var(--hw-ink);
      stroke-width: 13;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .frame-shadow {
      fill: var(--hw-sketch);
      stroke: none;
    }

    .frame-border {
      fill: var(--hw-cobalt-frame);
      stroke: var(--hw-ink);
      stroke-width: 15;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .panel-body {
      fill: var(--hw-paper);
      stroke: var(--hw-ink);
      stroke-width: 13;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .letter-glyph {
      fill: none;
      stroke: var(--hw-ink);
      stroke-width: 16;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @keyframes sign-sway {
      0% {
        transform: rotate(-2.2deg);
      }
      100% {
        transform: rotate(2.2deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .suspension-rig {
        animation: none;
      }
    }

    @media (forced-colors: active) {
      .frame-shadow { display: none; }
      .frame-border,
      .panel-body,
      .cord-line,
      .letter-glyph,
      .peg-node {
        stroke: CanvasText;
      }
      .frame-border,
      .peg-node {
        fill: CanvasText;
      }
      .panel-body {
        fill: Canvas;
      }
    }
  </style>

  <!-- Mounting Wall Anchor -->
  <g id="anchor-peg">
    <circle class="peg-node" cx="256" cy="62" r="18" />
  </g>

  <!-- Oscillating Signboard Rig -->
  <g id="hanging-rig" class="suspension-rig">
    <!-- Suspension Cords -->
    <g id="suspension-cords">
      <path class="cord-line" d="M 242 74 C 200 110 152 146 112 172" />
      <path class="cord-line" d="M 270 74 C 312 110 360 146 400 172" />
    </g>

    <!-- Signboard Body -->
    <g id="signboard">
      <!-- Offset Marker Drop Shadow -->
      <path class="frame-shadow"
            transform="translate(10, 12)"
            d="M 64 174
               C 114 171 224 166 448 168
               C 462 168 466 176 464 192
               C 461 260 464 342 460 416
               C 459 428 450 434 436 433
               C 330 429 170 433 72 431
               C 58 430 52 422 53 408
               C 55 334 53 252 56 188
               C 57 178 60 174 64 174 Z" />

      <!-- Outer Cobalt Marker Frame -->
      <path class="frame-border"
            d="M 64 174
               C 114 171 224 166 448 168
               C 462 168 466 176 464 192
               C 461 260 464 342 460 416
               C 459 428 450 434 436 433
               C 330 429 170 433 72 431
               C 58 430 52 422 53 408
               C 55 334 53 252 56 188
               C 57 178 60 174 64 174 Z" />

      <!-- Inner Paper/Obsidian Substrate Panel -->
      <path class="panel-body"
            d="M 94 204
               C 140 202 240 198 420 201
               C 429 201 433 206 432 216
               C 430 265 432 330 430 388
               C 429 397 423 401 413 400
               C 330 398 180 401 104 399
               C 94 399 90 394 91 385
               C 92 328 90 262 92 214
               C 92 207 94 204 94 204 Z" />

      <!-- Inked Lettering -->
      <g id="sign-lettering">
        <!-- O -->
        <path class="letter-glyph"
              d="M 152 252
                 C 126 252 115 272 115 298
                 C 115 324 126 344 152 344
                 C 178 344 189 324 189 298
                 C 189 272 178 252 152 252 Z" />

        <!-- P -->
        <path class="letter-glyph"
              d="M 215 252 L 215 344
                 M 215 252
                 C 242 250 258 258 258 276
                 C 258 294 242 302 215 302" />

        <!-- E -->
        <path class="letter-glyph"
              d="M 280 252 L 280 344
                 M 280 252 L 326 252
                 M 280 298 L 318 298
                 M 280 344 L 326 344" />

        <!-- N -->
        <path class="letter-glyph"
              d="M 350 344 L 350 252
                 L 394 344
                 L 394 252" />
      </g>
    </g>
  </g>
</svg>
