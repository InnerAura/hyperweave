<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512"
     height="512"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-labelledby="open-cobalt-title open-cobalt-desc">
  <title id="open-cobalt-title">Hand-Drawn Open Sign — Marker Cobalt</title>
  <desc id="open-cobalt-desc">Adaptive architectural sketch of a suspended hand-drawn open sign rendered in HyperWeave vellum marker-cobalt chromatics with harmonic pendulum oscillation.</desc>

  <metadata>
    <hw:metadata xmlns:hw="https://hyperweave.app/hw/v1.0">
      <hw:artifactType>signage-illustration</hw:artifactType>
      <hw:chromaticSystem>vellum-marker-cobalt</hw:chromaticSystem>
      <hw:geometryFormLanguage>hand-drawn-organic-contour</hw:geometryFormLanguage>
      <hw:reasoning>
        <hw:intent>Translate the physical hand-lettered suspended open sign into the HyperWeave vellum-marker-cobalt chromatic system, replacing multi-hue marker fills with a disciplined architectural hierarchy.</hw:intent>
        <hw:approach>Applied the strict tri-tier chromatic scheme from vellum orbit: deep marker ink (#1B1B1D) for structural contour boundaries and typography, electric cobalt (#1D4ED8) for the frame body and suspension anchor, and crisp paper white (#FFFFFF) for the inner sign face. Maintained single-pivot pendulum oscillation at (256, 62) using CIM transform-only keyframes with full prefers-reduced-motion and forced-colors support.</hw:approach>
        <hw:tradeoffs>Rejected multi-colored fills, gradient blurs, and raster turbulence displacement in favor of sharp, unpixelated vector paths that preserve maximum legible contrast across high-density displays.</hw:tradeoffs>
      </hw:reasoning>
    </hw:metadata>
  </metadata>

  <style>
    :root {
      --hw-paper: #FFFFFF;
      --hw-ink: #1B1B1D;
      --hw-cobalt: #1D4ED8;
      --hw-cobalt-subtle: #EFF4FF;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --hw-paper: #0B0F19;
        --hw-ink: #F8FAFC;
        --hw-cobalt: #3B82F6;
        --hw-cobalt-subtle: #131E36;
      }
    }

    /* Pendulum Rig (CIM: transform-only) */
    .suspension-rig {
      transform-origin: 256px 62px;
      animation: sign-sway 6s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite alternate;
    }

    .peg-node {
      fill: var(--hw-cobalt);
      stroke: var(--hw-ink);
      stroke-width: 11;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: fill 0.3s ease, stroke 0.3s ease;
    }

    .cord-line {
      fill: none;
      stroke: var(--hw-ink);
      stroke-width: 12;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.3s ease;
    }

    .frame-border {
      fill: var(--hw-cobalt);
      stroke: var(--hw-ink);
      stroke-width: 14;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: fill 0.3s ease, stroke 0.3s ease;
    }

    .panel-body {
      fill: var(--hw-paper);
      stroke: var(--hw-ink);
      stroke-width: 12;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: fill 0.3s ease, stroke 0.3s ease;
    }

    .letter-glyph {
      fill: none;
      stroke: var(--hw-ink);
      stroke-width: 15;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.3s ease;
    }

    @keyframes sign-sway {
      0% {
        transform: rotate(-2.2deg);
      }
      100% {
        transform: rotate(2.2deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .suspension-rig {
        animation: none;
      }
    }

    @media (forced-colors: active) {
      .frame-border,
      .panel-body,
      .cord-line,
      .letter-glyph,
      .peg-node {
        stroke: CanvasText;
      }
      .frame-border,
      .peg-node {
        fill: CanvasText;
      }
      .panel-body {
        fill: Canvas;
      }
    }
  </style>

  <!-- Mounting Wall Anchor -->
  <g id="anchor-peg">
    <circle class="peg-node" cx="256" cy="62" r="18" />
  </g>

  <!-- Oscillating Signboard Rig -->
  <g id="hanging-rig" class="suspension-rig">
    <!-- Suspension Cords -->
    <g id="suspension-cords">
      <path class="cord-line" d="M 242 74 C 200 110 152 146 112 172" />
      <path class="cord-line" d="M 270 74 C 312 110 360 146 400 172" />
    </g>

    <!-- Signboard Body -->
    <g id="signboard">
      <!-- Outer Cobalt Marker Frame -->
      <path class="frame-border"
            d="M 64 174
               C 114 171 224 166 448 168
               C 462 168 466 176 464 192
               C 461 260 464 342 460 416
               C 459 428 450 434 436 433
               C 330 429 170 433 72 431
               C 58 430 52 422 53 408
               C 55 334 53 252 56 188
               C 57 178 60 174 64 174 Z" />

      <!-- Inner Paper Substrate Panel -->
      <path class="panel-body"
            d="M 94 204
               C 140 202 240 198 420 201
               C 429 201 433 206 432 216
               C 430 265 432 330 430 388
               C 429 397 423 401 413 400
               C 330 398 180 401 104 399
               C 94 399 90 394 91 385
               C 92 328 90 262 92 214
               C 92 207 94 204 94 204 Z" />

      <!-- Hand-Drawn Ink Lettering -->
      <g id="sign-lettering">
        <!-- O -->
        <path class="letter-glyph"
              d="M 152 252
                 C 126 252 115 272 115 298
                 C 115 324 126 344 152 344
                 C 178 344 189 324 189 298
                 C 189 272 178 252 152 252 Z" />

        <!-- P -->
        <path class="letter-glyph"
              d="M 215 252 L 215 344
                 M 215 252
                 C 242 250 258 258 258 276
                 C 258 294 242 302 215 302" />

        <!-- E -->
        <path class="letter-glyph"
              d="M 280 252 L 280 344
                 M 280 252 L 326 252
                 M 280 298 L 318 298
                 M 280 344 L 326 344" />

        <!-- N -->
        <path class="letter-glyph"
              d="M 350 344 L 350 252
                 L 394 344
                 L 394 252" />
      </g>
    </g>
  </g>
</svg>
