<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 28 24"
     width="28"
     height="24"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-labelledby="http-title http-desc">
  <title id="http-title">HTTP API Action Glyph</title>
  <desc id="http-desc">Hand-drawn HTTP API badge in high-contrast obsidian and electric cobalt with a pulsating radar beacon.</desc>

  <metadata>
    <hw:metadata xmlns:hw="https://hyperweave.app/hw/v1.0">
      <hw:artifactType>inline-action-glyph</hw:artifactType>
      <hw:chromaticSystem>hand-drawn-cobalt-high-contrast</hw:chromaticSystem>
      <hw:geometryFormLanguage>hand-drawn-terminal-card</hw:geometryFormLanguage>
      <hw:reasoning>
        <hw:intent>Deliver an authoritative, tactile HTTP API badge optimized for inline Markdown headings in dark mode.</hw:intent>
        <hw:approach>Dark chassis switched to deep obsidian (#070B14) with pure white inking (#FFFFFF). Beacon upgraded to electric cobalt (#38BDF8) with a composite-only radar pulse. Purged non-CIM stroke transitions.</hw:approach>
        <hw:tradeoffs>Increased stroke weights by ~20% over native baseline to resist dark-mode visual bleeding at 20px scale.</hw:tradeoffs>
      </hw:reasoning>
    </hw:metadata>
  </metadata>

  <style>
    :root {
      --hw-paper: #FFFFFF;
      --hw-ink: #0F172A;
      --hw-cobalt: #1D4ED8;
      --hw-sketch: rgba(29, 78, 216, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --hw-paper: #070B14;
        --hw-ink: #FFFFFF;
        --hw-cobalt: #38BDF8;
        --hw-sketch: rgba(56, 189, 248, 0.24);
      }
    }

    .sketch-shadow {
      fill: var(--hw-sketch);
      stroke: none;
    }

    .sketch-plate {
      fill: var(--hw-paper);
      stroke: var(--hw-ink);
      stroke-width: 1.65;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .letter-stroke {
      fill: none;
      stroke: var(--hw-ink);
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .beacon-core {
      fill: var(--hw-cobalt);
    }

    .beacon-ring {
      fill: none;
      stroke: var(--hw-cobalt);
      stroke-width: 1.1;
      transform-origin: 22.2px 6.2px;
      animation: beacon-ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    @keyframes beacon-ping {
      0% {
        transform: scale(0.9);
        opacity: 0.95;
      }
      75%, 100% {
        transform: scale(2.4);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .beacon-ring {
        animation: none;
        opacity: 0.4;
        transform: scale(1.6);
      }
    }

    @media (forced-colors: active) {
      .sketch-shadow { display: none; }
      .sketch-plate { stroke: CanvasText; fill: Canvas; }
      .letter-stroke { stroke: CanvasText; }
      .beacon-core { fill: CanvasText; }
      .beacon-ring { stroke: CanvasText; }
    }
  </style>

  <!-- Tactile Marker Underlay -->
  <path class="sketch-shadow"
        transform="translate(0.8, 0.9)"
        d="M 3.2 3.8
           C 9.6 3.2, 17.6 3.5, 24.8 4.0
           C 25.3 8.9, 25.1 14.0, 24.5 18.7
           C 17.8 19.2, 9.8 18.9, 3.0 18.4
           C 2.6 13.5, 2.7 8.5, 3.2 3.8 Z" />

  <!-- Hand-Drawn Chassis -->
  <path class="sketch-plate"
        d="M 3.2 3.8
           C 9.6 3.2, 17.6 3.5, 24.8 4.0
           C 25.3 8.9, 25.1 14.0, 24.5 18.7
           C 17.8 19.2, 9.8 18.9, 3.0 18.4
           C 2.6 13.5, 2.7 8.5, 3.2 3.8 Z" />

  <!-- Hand-Inked Lettering: A · P · I -->
  <g class="letter-group">
    <!-- Letter A -->
    <path class="letter-stroke"
          d="M 5.4 15.8 L 7.8 7.4 L 10.4 15.8" />
    <path class="letter-stroke"
          d="M 6.4 12.6 L 9.4 12.6" />

    <!-- Letter P -->
    <path class="letter-stroke"
          d="M 12.6 7.4 L 12.6 15.8" />
    <path class="letter-stroke"
          d="M 12.6 7.4
             C 14.9 7.1, 16.2 8.0, 16.2 9.5
             C 16.2 11.1, 14.9 11.9, 12.6 11.8" />

    <!-- Letter I -->
    <path class="letter-stroke"
          d="M 18.6 7.4 L 18.6 15.8" />
    <path class="letter-stroke"
          d="M 17.5 7.4 L 19.7 7.4" />
    <path class="letter-stroke"
          d="M 17.5 15.8 L 19.7 15.8" />
  </g>

  <!-- Live Endpoint Signal Beacon -->
  <g class="beacon-group">
    <circle class="beacon-ring" cx="22.2" cy="6.2" r="1.3" />
    <circle class="beacon-core" cx="22.2" cy="6.2" r="1.3" />
  </g>
</svg>
