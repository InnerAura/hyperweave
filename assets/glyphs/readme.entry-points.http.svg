<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 28 24"
     width="28"
     height="24"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-labelledby="http-title http-desc">
  <title id="http-title">HTTP API Action Glyph</title>
  <desc id="http-desc">Hand-drawn HTTP API badge in HyperWeave marker-cobalt DNA featuring clean hand-lettered type and an integrated live endpoint ping beacon.</desc>

  <metadata>
    <hw:metadata xmlns:hw="https://hyperweave.app/hw/v1.0">
      <hw:artifactType>inline-action-glyph</hw:artifactType>
      <hw:chromaticSystem>excalidraw-marker-cobalt</hw:chromaticSystem>
      <hw:geometryFormLanguage>hand-drawn-terminal-card</hw:geometryFormLanguage>
      <hw:reasoning>
        <hw:intent>Refactor the HTTP API badge to eliminate the distorted corner splotch, replacing it with an integrated HyperWeave live signal ping beacon that honors typographic clearance.</hw:intent>
        <hw:approach>Removed the colliding S-curve wire. Respaced the hand-inked 'A-P-I' glyphs across x=5.2 to x=19.8 to maintain uniform kerning. Placed a precision 1.3px cobalt beacon at (22.2, 6.2) with a concentric CIM-compliant radar wave expanding via scale and opacity.</hw:approach>
        <hw:tradeoffs>Eliminated decorative tail paths to prevent stroke collision at 24px micro viewports, prioritizing instant readability and semantic signal fidelity.</hw:tradeoffs>
      </hw:reasoning>
    </hw:metadata>
  </metadata>

  <style>
    :root {
      --hw-paper: #FFFFFF;
      --hw-ink: #1B1B1D;
      --hw-cobalt: #1D4ED8;
      --hw-sketch: rgba(29, 78, 216, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --hw-paper: #0F172A;
        --hw-ink: #F8FAFC;
        --hw-cobalt: #60A5FA;
        --hw-sketch: rgba(96, 165, 250, 0.14);
      }
    }

    .sketch-plate {
      fill: var(--hw-paper);
      stroke: var(--hw-ink);
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: fill 0.2s ease, stroke 0.2s ease;
    }

    .sketch-shadow {
      fill: var(--hw-sketch);
      stroke: none;
    }

    .letter-stroke {
      fill: none;
      stroke: var(--hw-ink);
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s ease;
    }

    .beacon-core {
      fill: var(--hw-cobalt);
      transition: fill 0.2s ease;
    }

    .beacon-ring {
      fill: none;
      stroke: var(--hw-cobalt);
      stroke-width: 0.8;
      transform-origin: 22.2px 6.2px;
      animation: beacon-ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    @keyframes beacon-ping {
      0% {
        transform: scale(0.9);
        opacity: 0.95;
      }
      75%, 100% {
        transform: scale(2.4);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .beacon-ring {
        animation: none;
        opacity: 0.4;
        transform: scale(1.6);
      }
    }

    @media (forced-colors: active) {
      .sketch-plate { stroke: CanvasText; fill: Canvas; }
      .letter-stroke { stroke: CanvasText; }
      .beacon-core { fill: CanvasText; }
      .beacon-ring { stroke: CanvasText; }
    }
  </style>

  <!-- Offset Sketch Shadow -->
  <path class="sketch-shadow"
        d="M 3.2 4.4
           C 9.6 3.9, 17.6 4.1, 24.8 4.6
           C 25.3 9.4, 25.1 14.4, 24.5 19.3
           C 17.8 19.8, 9.8 19.5, 3.0 19.0
           C 2.6 14.1, 2.7 9.1, 3.2 4.4 Z" />

  <!-- Hand-Drawn Whiteboard Chassis -->
  <path class="sketch-plate"
        d="M 3.2 3.8
           C 9.6 3.2, 17.6 3.5, 24.8 4.0
           C 25.3 8.9, 25.1 14.0, 24.5 18.7
           C 17.8 19.2, 9.8 18.9, 3.0 18.4
           C 2.6 13.5, 2.7 8.5, 3.2 3.8 Z" />

  <!-- Hand-Drawn Lettering: A · P · I -->
  <g class="letter-group">
    <!-- Letter A -->
    <path class="letter-stroke"
          d="M 5.4 15.8
             L 7.8 7.4
             L 10.4 15.8" />
    <path class="letter-stroke"
          d="M 6.4 12.6
             L 9.4 12.6" />

    <!-- Letter P -->
    <path class="letter-stroke"
          d="M 12.6 7.4
             L 12.6 15.8" />
    <path class="letter-stroke"
          d="M 12.6 7.4
             C 14.9 7.1, 16.2 8.0, 16.2 9.5
             C 16.2 11.1, 14.9 11.9, 12.6 11.8" />

    <!-- Letter I -->
    <path class="letter-stroke"
          d="M 18.6 7.4
             L 18.6 15.8" />
    <path class="letter-stroke"
          d="M 17.5 7.4
             L 19.7 7.4" />
    <path class="letter-stroke"
          d="M 17.5 15.8
             L 19.7 15.8" />
  </g>

  <!-- Live Endpoint Signal Beacon -->
  <g class="beacon-group">
    <circle class="beacon-ring" cx="22.2" cy="6.2" r="1.3" />
    <circle class="beacon-core" cx="22.2" cy="6.2" r="1.3" />
  </g>
</svg>
