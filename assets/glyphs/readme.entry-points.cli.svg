<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 28 24"
     width="28"
     height="24"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-labelledby="cli-sketch-title cli-sketch-desc">
  <title id="cli-sketch-title">Hand-Drawn CLI Prompt</title>
  <desc id="cli-sketch-desc">Wobbly sketch terminal badge with high-contrast electric cobalt prompt and blinking cursor.</desc>

  <metadata>
    <hw:metadata xmlns:hw="https://hyperweave.app/hw/v1.0">
      <hw:artifactType>inline-action-glyph</hw:artifactType>
      <hw:chromaticSystem>hand-drawn-cobalt-high-contrast</hw:chromaticSystem>
      <hw:geometryFormLanguage>hand-drawn-terminal-box</hw:geometryFormLanguage>
      <hw:reasoning>
        <hw:intent>Deliver an assertive, high-contrast CLI prompt glyph optimized for dark navigation panels without losing tactile hand-drawn texture.</hw:intent>
        <hw:approach>Compensated for irradiation line-thinning by increasing stroke weights. Shifted dark fill from slate-900 to deep terminal obsidian (#070B14) and swapped desaturated blue for electric cobalt (#38BDF8). Offset the marker underlay to produce a physical ink-shadow effect.</hw:approach>
        <hw:tradeoffs>Rejected soft-gradient glow filters and radial drop-shadows to prevent raster mush, preserving sharp vector geometry and strict zero-runtime execution.</hw:tradeoffs>
      </hw:reasoning>
    </hw:metadata>
  </metadata>

  <style>
    :root {
      --hw-tile: rgba(15, 23, 42, 0.04);
      --hw-paper: #FFFFFF;
      --hw-ink: #0F172A;
      --hw-cobalt: #1D4ED8;
      --hw-sketch: rgba(29, 78, 216, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --hw-tile: #0F172A;
        --hw-paper: #070B14;
        --hw-ink: #FFFFFF;
        --hw-cobalt: #38BDF8;
        --hw-sketch: rgba(56, 189, 248, 0.22);
      }
    }

    .tile-base {
      fill: var(--hw-tile);
      stroke: none;
    }

    .term-box {
      fill: var(--hw-paper);
      stroke: var(--hw-ink);
      stroke-width: 1.65;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sketch-bg {
      fill: var(--hw-sketch);
      stroke: none;
    }

    .prompt-gt {
      fill: none;
      stroke: var(--hw-cobalt);
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .cursor-under {
      stroke: var(--hw-ink);
      stroke-width: 2.2;
      stroke-linecap: round;
      animation: cursor-flash 1s steps(1, start) infinite;
    }

    @keyframes cursor-flash {
      0%, 49% {
        opacity: 1;
      }
      50%, 100% {
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor-under {
        animation: none;
        opacity: 1;
      }
    }

    @media (forced-colors: active) {
      .tile-base { fill: transparent; }
      .term-box { stroke: CanvasText; fill: Canvas; }
      .prompt-gt, .cursor-under { stroke: CanvasText; }
    }
  </style>

  <!-- Framing Tile Container -->
  <rect class="tile-base" x="1" y="1" width="26" height="22" rx="5.5" />

  <!-- Offset Tactile Marker Shadow -->
  <path class="sketch-bg"
        transform="translate(0.8, 0.9)"
        d="M 3.8 4.2 C 10.8 3.7, 18.2 4.1, 24.6 4.3 C 25.1 9.8, 24.8 15.4, 24.4 19.8 C 17.6 20.4, 10.4 19.9, 3.4 19.7 C 3.1 14.5, 3.3 9.2, 3.8 4.2 Z" />

  <!-- Hand-Drawn Terminal Body -->
  <path class="term-box"
        d="M 3.8 4.2
           C 10.6 3.6, 18.2 4.1, 24.6 4.3
           C 25.1 9.8, 24.8 15.4, 24.4 19.8
           C 17.6 20.4, 10.4 19.9, 3.4 19.7
           C 3.1 14.5, 3.3 9.2, 3.8 4.2 Z" />

  <!-- Electric Cobalt Prompt -->
  <path class="prompt-gt" d="M 7.5 8.8 L 12.2 12 L 7.5 15.2" />

  <!-- High-Contrast Inked Cursor -->
  <line class="cursor-under" x1="14.8" y1="15.8" x2="20.6" y2="15.8" />
</svg>
