<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 28 28"
     width="28"
     height="28"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-labelledby="mg-title mg-desc">
  <title id="mg-title">Magnifying Glass Glyph</title>
  <desc id="mg-desc">Hand-drawn marker magnifying glass with an optical cobalt focal glint for inspection, query, and discovery.</desc>

  <metadata>
    <hw:metadata xmlns:hw="https://hyperweave.app/hw/v1.0">
      <hw:artifactType>heading-glyph</hw:artifactType>
      <hw:chromaticSystem>excalidraw-marker-cobalt</hw:chromaticSystem>
      <hw:geometryFormLanguage>hand-drawn-optical-loop</hw:geometryFormLanguage>
      <hw:reasoning>
        <hw:intent>Deliver an iconic magnifying glass for search, examination, and inquiry sections.</hw:intent>
        <hw:approach>Built a 45-degree angled hand-drawn lens rim and stem. Integrated a cobalt specular arc inside the glass chamber that shifts subtly with transform motion.</hw:approach>
        <hw:tradeoffs>Kept the lens transparent to allow host paper or dark backgrounds to show through without raster fog.</hw:tradeoffs>
      </hw:reasoning>
    </hw:metadata>
  </metadata>

  <style>
    :root {
      --hw-paper: #FFFFFF;
      --hw-ink: #1B1B1D;
      --hw-cobalt: #1D4ED8;
      --hw-sketch: rgba(29, 78, 216, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --hw-paper: #0F172A;
        --hw-ink: #F8FAFC;
        --hw-cobalt: #60A5FA;
        --hw-sketch: rgba(96, 165, 250, 0.14);
      }
    }

    .glass-rig {
      transform-origin: 11.5px 11.5px;
      animation: scan-tilt 4s ease-in-out infinite alternate;
    }

    .marker-rim {
      fill: none;
      stroke: var(--hw-ink);
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s ease;
    }

    .marker-handle {
      fill: none;
      stroke: var(--hw-ink);
      stroke-width: 2.4;
      stroke-linecap: round;
      transition: stroke 0.2s ease;
    }

    .lens-glint {
      fill: none;
      stroke: var(--hw-cobalt);
      stroke-width: 1.4;
      stroke-linecap: round;
      transition: stroke 0.2s ease;
    }

    .shadow-trace {
      fill: none;
      stroke: var(--hw-sketch);
      stroke-width: 3.2;
      stroke-linecap: round;
    }

    @keyframes scan-tilt {
      0% { transform: rotate(-3deg) scale(0.97); }
      100% { transform: rotate(4deg) scale(1.03); }
    }

    @media (prefers-reduced-motion: reduce) {
      .glass-rig { animation: none; transform: none; }
    }

    @media (forced-colors: active) {
      .marker-rim, .marker-handle, .lens-glint { stroke: CanvasText; }
    }
  </style>

  <g class="glass-rig">
    <!-- Underlay Wash -->
    <path class="shadow-trace"
          d="M 11.2 4.6
             C 15.3 4.4, 18.8 7.9, 18.6 12.0
             C 18.4 16.1, 14.9 19.4, 10.8 19.2
             C 6.7 19.0, 3.4 15.5, 3.6 11.4
             C 3.8 7.3, 7.1 4.8, 11.2 4.6 Z" />
    <path class="shadow-trace" d="M 17.2 17.2 L 23.8 23.8" />

    <!-- Lens Rim -->
    <path class="marker-rim"
          d="M 11.2 4.6
             C 15.3 4.4, 18.8 7.9, 18.6 12.0
             C 18.4 16.1, 14.9 19.4, 10.8 19.2
             C 6.7 19.0, 3.4 15.5, 3.6 11.4
             C 3.8 7.3, 7.1 4.8, 11.2 4.6 Z" />

    <!-- Specular Cobalt Glint -->
    <path class="lens-glint"
          d="M 7.2 9.2
             C 8.2 7.6, 10.2 6.8, 12.4 7.2" />

    <!-- Handle -->
    <path class="marker-handle" d="M 17.2 17.2 L 23.8 23.8" />
  </g>
</svg>