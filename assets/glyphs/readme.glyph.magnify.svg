<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 28 28"
     width="28"
     height="28"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-labelledby="mg-title mg-desc">
  <title id="mg-title">Magnifying Glass Glyph</title>
  <desc id="mg-desc">Hand-drawn marker magnifying glass in high-contrast obsidian and electric cobalt with an active optical glint.</desc>

  <metadata>
    <hw:metadata xmlns:hw="https://hyperweave.app/hw/v1.0">
      <hw:artifactType>heading-glyph</hw:artifactType>
      <hw:chromaticSystem>hand-drawn-cobalt-high-contrast</hw:chromaticSystem>
      <hw:geometryFormLanguage>hand-drawn-optical-loop</hw:geometryFormLanguage>
      <hw:reasoning>
        <hw:intent>Deliver a punchy inspection icon that holds structural clarity when rendered next to bold headings in dark mode.</hw:intent>
        <hw:approach>Strengthened rim stroke to 2.2px and handle to 2.8px to resist irradiation thinning. Upgraded the optical glint to electric cobalt (#38BDF8) at 1.85px. Purged all CSS stroke transitions to maintain strict CIM compliance.</hw:approach>
        <hw:tradeoffs>Maintained transparent optical lens center to avoid raster occlusion while anchoring the rim with an offset riso trace.</hw:tradeoffs>
      </hw:reasoning>
    </hw:metadata>
  </metadata>

  <style>
    :root {
      --hw-ink: #0F172A;
      --hw-cobalt: #1D4ED8;
      --hw-sketch: rgba(29, 78, 216, 0.14);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --hw-ink: #FFFFFF;
        --hw-cobalt: #38BDF8;
        --hw-sketch: rgba(56, 189, 248, 0.26);
      }
    }

    .glass-rig {
      transform-origin: 11.5px 11.5px;
      animation: scan-tilt 4s ease-in-out infinite alternate;
    }

    .shadow-trace {
      fill: none;
      stroke: var(--hw-sketch);
      stroke-width: 3.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .marker-rim {
      fill: none;
      stroke: var(--hw-ink);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .marker-handle {
      fill: none;
      stroke: var(--hw-ink);
      stroke-width: 2.8;
      stroke-linecap: round;
    }

    .lens-glint {
      fill: none;
      stroke: var(--hw-cobalt);
      stroke-width: 1.85;
      stroke-linecap: round;
    }

    @keyframes scan-tilt {
      0% { transform: rotate(-3deg) scale(0.97); }
      100% { transform: rotate(4deg) scale(1.03); }
    }

    @media (prefers-reduced-motion: reduce) {
      .glass-rig { animation: none; transform: none; }
    }

    @media (forced-colors: active) {
      .shadow-trace { display: none; }
      .marker-rim, .marker-handle, .lens-glint { stroke: CanvasText; }
    }
  </style>

  <g class="glass-rig">
    <!-- Offset Riso Marker Trace -->
    <g transform="translate(0.8, 0.9)">
      <path class="shadow-trace"
            d="M 11.2 4.6
               C 15.3 4.4, 18.8 7.9, 18.6 12.0
               C 18.4 16.1, 14.9 19.4, 10.8 19.2
               C 6.7 19.0, 3.4 15.5, 3.6 11.4
               C 3.8 7.3, 7.1 4.8, 11.2 4.6 Z" />
      <path class="shadow-trace" d="M 17.2 17.2 L 23.8 23.8" />
    </g>

    <!-- Structural Lens Rim -->
    <path class="marker-rim"
          d="M 11.2 4.6
             C 15.3 4.4, 18.8 7.9, 18.6 12.0
             C 18.4 16.1, 14.9 19.4, 10.8 19.2
             C 6.7 19.0, 3.4 15.5, 3.6 11.4
             C 3.8 7.3, 7.1 4.8, 11.2 4.6 Z" />

    <!-- Specular Electric Cobalt Glint -->
    <path class="lens-glint"
          d="M 7.2 9.2 C 8.2 7.6, 10.2 6.8, 12.4 7.2" />

    <!-- Solid Inked Handle -->
    <path class="marker-handle" d="M 17.2 17.2 L 23.8 23.8" />
  </g>
</svg>
