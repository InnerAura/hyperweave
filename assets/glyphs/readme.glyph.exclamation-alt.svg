<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="-5 -5 40 40"
     width="32"
     height="32"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-labelledby="heading-what-title heading-what-desc">
  <title id="heading-what-title">What Is Hyperweave Glyph</title>
  <desc id="heading-what-desc">Hand-drawn marker question mark in crisp white and electric cobalt with a pulsing tactile beacon point.</desc>

  <metadata>
    <hw:metadata xmlns:hw="https://hyperweave.app/hw/v1.0">
      <hw:artifactType>heading-glyph</hw:artifactType>
      <hw:chromaticSystem>hand-drawn-cobalt-high-contrast</hw:chromaticSystem>
      <hw:geometryFormLanguage>wobbly-question-bobbing-dot</hw:geometryFormLanguage>
      <hw:reasoning>
        <hw:intent>Upgrade the inquiry heading glyph to stand out assertively against dark documentation panels.</hw:intent>
        <hw:approach>Introduced an offset riso marker shadow underlay behind the query curve. Increased main stroke weight to 2.5px to counteract optical bleeding and set the breathing dot to electric cobalt (#38BDF8) with high-contrast ink framing.</hw:approach>
        <hw:tradeoffs>Retained the simplified single-stroke question mark chassis while elevating physical depth via tactile registration offsets.</hw:tradeoffs>
      </hw:reasoning>
    </hw:metadata>
  </metadata>

  <style>
    :root {
      --hw-ink: #0F172A;
      --hw-cobalt: #1D4ED8;
      --hw-sketch: rgba(29, 78, 216, 0.14);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --hw-ink: #FFFFFF;
        --hw-cobalt: #38BDF8;
        --hw-sketch: rgba(56, 189, 248, 0.26);
      }
    }

    .sketch-group {
      transform-origin: 15px 15px;
      animation: question-bob 5s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    .sketch-underlay {
      fill: none;
      stroke: var(--hw-sketch);
      stroke-width: 3.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .wobbly-mark {
      fill: none;
      stroke: var(--hw-ink);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .breathing-dot {
      fill: var(--hw-cobalt);
      stroke: var(--hw-ink);
      stroke-width: 1.6;
      transform-origin: 15px 26px;
      animation: dot-pulse 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
    }

    @keyframes question-bob {
      0%, 100% { transform: translateY(0.5px) rotate(-1.5deg); }
      50% { transform: translateY(-0.8px) rotate(1.5deg); }
    }

    @keyframes dot-pulse {
      0% { transform: scale(0.85); opacity: 0.85; }
      100% { transform: scale(1.15); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .sketch-group, .breathing-dot {
        animation: none;
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (forced-colors: active) {
      .sketch-underlay { display: none; }
      .wobbly-mark { stroke: CanvasText; }
      .breathing-dot { fill: CanvasText; stroke: Canvas; }
    }
  </style>

  <g class="sketch-group">
    <!-- Offset Tactile Marker Trace -->
    <path class="sketch-underlay"
          transform="translate(0.8, 0.9)"
          d="M 15 21 C 15 15, 10 12, 10 8
             C 10 4, 15 2, 20 5
             C 24 8, 22 13, 20 15
             L 15 21" />

    <!-- Inked Question Mark Chassis -->
    <path class="wobbly-mark"
          d="M 15 21 C 15 15, 10 12, 10 8
             C 10 4, 15 2, 20 5
             C 24 8, 22 13, 20 15
             L 15 21" />

    <!-- Electric Cobalt Beacon Dot -->
    <circle class="breathing-dot" cx="15" cy="26" r="3.0" />
  </g>
</svg>
