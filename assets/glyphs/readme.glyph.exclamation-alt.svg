<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="-5 -5 40 40"
     width="32"
     height="32"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-labelledby="heading-what-title heading-what-desc">
  <title id="heading-what-title">What Is Hyperweave Glyph</title>
  <desc id="heading-what-desc">A simple, wobbly, hand-drawn marker-ink question mark with a kinetic central point.</desc>

  <metadata>
    <hw:metadata xmlns:hw="https://hyperweave.app/hw/v1.0">
      <hw:artifactType>heading-glyph</hw:artifactType>
      <hw:chromaticSystem>excalidraw-marker-cobalt</hw:chromaticSystem>
      <hw:geometryFormLanguage>wobbly-question-bobbing-dot</hw:geometryFormLanguage>
      <hw:reasoning>
        <hw:intent>Create the simplest possible gestalt for a query header, prioritizing instant visual comprehension of 'What Is' over previous process diagrams.</hw:intent>
        <hw:approach>Engineered a wobbly single-stroke marker path for the question mark chassis. Applied continuous CIM head-bobbing transform motion to the upper arc and a breathing pulse transform to the core dot at (15, 26). Utilized adaptive tokens to manage Ink/Cobalt/Paper substrate contrast.</hw:approach>
        <hw:tradeoffs>Rejected complex input/output compiler visualization (Turns 2/3) in favor of the requested simple query symbol, trusting the text to detail the transformation mechanics.</hw:tradeoffs>
      </hw:reasoning>
    </hw:metadata>
  </metadata>

  <style>
    :root {
      --hw-ink: #1B1B1D;
      --hw-cobalt: #1D4ED8;
      --hw-paper: #FFFFFF;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --hw-ink: #F8FAFC;
        --hw-cobalt: #60A5FA;
        --hw-paper: #0F172A;
      }
    }

    .sketch-group {
      transform-origin: 15px 15px;
      animation: question-bob 5s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    .wobbly-mark {
      fill: none;
      stroke: var(--hw-ink);
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .breathing-dot {
      fill: var(--hw-cobalt);
      stroke: var(--hw-ink);
      stroke-width: 1.2;
      transform-origin: 15px 26px;
      animation: dot-pulse 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
    }

    @keyframes question-bob {
      0%, 100% { transform: translateY(0.5px) rotate(-1.5deg); }
      50% { transform: translateY(-0.8px) rotate(1.5deg); }
    }

    @keyframes dot-pulse {
      0% { transform: scale(0.85); opacity: 0.8; }
      100% { transform: scale(1.15); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .sketch-group, .breathing-dot {
        animation: none;
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (forced-colors: active) {
      .wobbly-mark { stroke: CanvasText; }
      .breathing-dot { fill: CanvasText; stroke: Canvas; }
    }
  </style>

  <g class="sketch-group">
    <!-- Hand-Drawn Wobbly Question Mark chassis -->
    <path class="wobbly-mark"
          d="M 15 21 C 15 15, 10 12, 10 8
             C 10 4, 15 2, 20 5
             C 24 8, 22 13, 20 15
             L 15 21 L 15 21 Z"
          transform="translate(-1, -1)" />

    <!-- Kinetic Beacon Point -->
    <circle class="breathing-dot" cx="15" cy="26" r="2.8" />
  </g>
</svg>
