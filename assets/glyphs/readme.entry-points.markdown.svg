<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 28 24"
     width="28"
     height="24"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-labelledby="md-title md-desc">
  <title id="md-title">Markdown SKILL.md Action Glyph</title>
  <desc id="md-desc">Hand-drawn Markdown badge in obsidian and electric cobalt featuring an inked M glyph and a drifting directional arrow.</desc>

  <metadata>
    <hw:metadata xmlns:hw="https://hyperweave.app/hw/v1.0">
      <hw:artifactType>inline-action-glyph</hw:artifactType>
      <hw:chromaticSystem>hand-drawn-cobalt-high-contrast</hw:chromaticSystem>
      <hw:geometryFormLanguage>hand-drawn-markdown-plate</hw:geometryFormLanguage>
      <hw:reasoning>
        <hw:intent>Translate the Markdown standard mark into an assertive, high-contrast action glyph for inline documentation links.</hw:intent>
        <hw:approach>Replaced washed slate chassis with obsidian (#070B14) and boosted letterform stroke weights. Arrow rendered in high-energy electric cobalt (#38BDF8) with pure CIM-compliant translateY pulse.</hw:approach>
        <hw:tradeoffs>Stripped stroke/fill CSS transitions in favor of pure composite-only translation transforms.</hw:tradeoffs>
      </hw:reasoning>
    </hw:metadata>
  </metadata>

  <style>
    :root {
      --hw-paper: #FFFFFF;
      --hw-ink: #0F172A;
      --hw-cobalt: #1D4ED8;
      --hw-sketch: rgba(29, 78, 216, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --hw-paper: #070B14;
        --hw-ink: #FFFFFF;
        --hw-cobalt: #38BDF8;
        --hw-sketch: rgba(56, 189, 248, 0.24);
      }
    }

    .sketch-shadow {
      fill: var(--hw-sketch);
      stroke: none;
    }

    .sketch-plate {
      fill: var(--hw-paper);
      stroke: var(--hw-ink);
      stroke-width: 1.65;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .m-glyph {
      fill: none;
      stroke: var(--hw-ink);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .arrow-glyph {
      fill: none;
      stroke: var(--hw-cobalt);
      stroke-width: 1.95;
      stroke-linecap: round;
      stroke-linejoin: round;
      transform-origin: 19.2px 11.8px;
      animation: arrow-bounce 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
    }

    @keyframes arrow-bounce {
      0% {
        transform: translateY(-0.8px);
      }
      100% {
        transform: translateY(0.8px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .arrow-glyph {
        animation: none;
        transform: none;
      }
    }

    @media (forced-colors: active) {
      .sketch-shadow { display: none; }
      .sketch-plate { stroke: CanvasText; fill: Canvas; }
      .m-glyph, .arrow-glyph { stroke: CanvasText; }
    }
  </style>

  <!-- Offset Tactile Marker Shadow -->
  <path class="sketch-shadow"
        transform="translate(0.8, 0.9)"
        d="M 3.2 3.8
           C 9.6 3.2, 17.6 3.5, 24.8 4.0
           C 25.3 8.9, 25.1 14.0, 24.5 18.7
           C 17.8 19.2, 9.8 18.9, 3.0 18.4
           C 2.6 13.5, 2.7 8.5, 3.2 3.8 Z" />

  <!-- Hand-Drawn Whiteboard Chassis -->
  <path class="sketch-plate"
        d="M 3.2 3.8
           C 9.6 3.2, 17.6 3.5, 24.8 4.0
           C 25.3 8.9, 25.1 14.0, 24.5 18.7
           C 17.8 19.2, 9.8 18.9, 3.0 18.4
           C 2.6 13.5, 2.7 8.5, 3.2 3.8 Z" />

  <!-- Hand-Drawn 'M' -->
  <path class="m-glyph"
        d="M 6.4 15.8
           L 6.4 7.6
           L 9.6 11.6
           L 12.8 7.6
           L 12.8 15.8" />

  <!-- Kinetic Electric Cobalt Down Arrow -->
  <g class="arrow-glyph">
    <line x1="19.2" y1="7.6" x2="19.2" y2="15.8" />
    <polyline points="16.4,12.8 19.2,15.8 22.0,12.8" />
  </g>
</svg>
