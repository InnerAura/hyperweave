<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 28 24"
     width="28"
     height="24"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-labelledby="cute-discord-title cute-discord-desc">
  <title id="cute-discord-title">Discord Community Glyph</title>
  <desc id="cute-discord-desc">Hand-drawn Clyde mascot in high-contrast obsidian and electric cobalt marker ink with persistent specular eye glints.</desc>

  <metadata>
    <hw:metadata xmlns:hw="https://hyperweave.app/hw/v1.0">
      <hw:artifactType>inline-action-glyph</hw:artifactType>
      <hw:chromaticSystem>hand-drawn-cobalt-high-contrast</hw:chromaticSystem>
      <hw:geometryFormLanguage>hand-drawn-organic-clyde</hw:geometryFormLanguage>
      <hw:reasoning>
        <hw:intent>Preserve Clyde's expressive friendly demeanor in dark mode while fixing ocular inversion bugs.</hw:intent>
        <hw:approach>Decoupled specular eye reflections from the paper background variable to prevent dark-mode glint extinction. Offset the marker underlay by (0.8px, 0.9px), increased chassis stroke to 1.65px, and applied electric cobalt (#38BDF8) to the pupils.</hw:approach>
        <hw:tradeoffs>Preserved cute micro head-bobbing purely via transform keyframes without CSS transition baggage.</hw:tradeoffs>
      </hw:reasoning>
    </hw:metadata>
  </metadata>

  <style>
    :root {
      --hw-paper: #FFFFFF;
      --hw-ink: #0F172A;
      --hw-cobalt: #1D4ED8;
      --hw-sketch: rgba(29, 78, 216, 0.12);
      --hw-glint: #FFFFFF;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --hw-paper: #070B14;
        --hw-ink: #FFFFFF;
        --hw-cobalt: #38BDF8;
        --hw-sketch: rgba(56, 189, 248, 0.24);
        --hw-glint: #FFFFFF;
      }
    }

    .clyde-group {
      transform-origin: 14px 12.5px;
      animation: clyde-bob 3.6s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite alternate;
    }

    .clyde-underlay {
      fill: var(--hw-sketch);
      stroke: none;
    }

    .clyde-body {
      fill: var(--hw-paper);
      stroke: var(--hw-ink);
      stroke-width: 1.65;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .clyde-eye {
      fill: var(--hw-cobalt);
    }

    .eye-glint {
      fill: var(--hw-glint);
    }

    @keyframes clyde-bob {
      0% {
        transform: translateY(0.4px) scale(0.98);
      }
      100% {
        transform: translateY(-0.8px) scale(1.02) rotate(1.2deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .clyde-group {
        animation: none;
        transform: none;
      }
    }

    @media (forced-colors: active) {
      .clyde-underlay { display: none; }
      .clyde-body { stroke: CanvasText; fill: Canvas; }
      .clyde-eye { fill: CanvasText; }
      .eye-glint { fill: Canvas; }
    }
  </style>

  <g class="clyde-group">
    <!-- Offset Marker Underlay -->
    <path class="clyde-underlay"
          transform="translate(0.8, 0.9)"
          d="M 8.2 6.8
             C 10.4 6.1, 12.1 6.4, 14 6.4
             C 15.9 6.4, 17.6 6.1, 19.8 6.8
             C 20.7 7.2, 21.6 8.3, 22.1 9.4
             C 23.5 12.1, 23.9 15.3, 23.3 16.7
             C 22.5 17.9, 20.8 18.2, 19.2 18.2
             L 17.7 16.5
             C 16.3 17.1, 14.9 17.2, 14 17.2
             C 13.1 17.2, 11.7 17.1, 10.3 16.5
             L 8.8 18.2
             C 7.2 18.2, 5.5 17.9, 4.7 16.7
             C 4.1 15.3, 4.5 12.1, 5.9 9.4
             C 6.4 8.3, 7.3 7.2, 8.2 6.8 Z" />

    <!-- Hand-Drawn Clyde Chassis -->
    <path class="clyde-body"
          d="M 8.2 6.8
             C 10.4 6.1, 12.1 6.4, 14 6.4
             C 15.9 6.4, 17.6 6.1, 19.8 6.8
             C 20.7 7.2, 21.6 8.3, 22.1 9.4
             C 23.5 12.1, 23.9 15.3, 23.3 16.7
             C 22.5 17.9, 20.8 18.2, 19.2 18.2
             L 17.7 16.5
             C 16.3 17.1, 14.9 17.2, 14 17.2
             C 13.1 17.2, 11.7 17.1, 10.3 16.5
             L 8.8 18.2
             C 7.2 18.2, 5.5 17.9, 4.7 16.7
             C 4.1 15.3, 4.5 12.1, 5.9 9.4
             C 6.4 8.3, 7.3 7.2, 8.2 6.8 Z" />

    <!-- Left Eye + Specular Glint -->
    <circle class="clyde-eye" cx="10.4" cy="12.2" r="2.1" />
    <circle class="eye-glint" cx="11.1" cy="11.5" r="0.75" />

    <!-- Right Eye + Specular Glint -->
    <circle class="clyde-eye" cx="17.6" cy="12.2" r="2.1" />
    <circle class="eye-glint" cx="18.3" cy="11.5" r="0.75" />
  </g>
</svg>
