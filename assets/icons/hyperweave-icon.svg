                outer node beads and stroke miters.
            </hw:approach>
            <hw:tradeoffs>
                Tightened outer safety buffer to 9.5px to prioritize mark footprint and
                instant silhouette recognition at smaller rendering profiles.
            </hw:tradeoffs>
