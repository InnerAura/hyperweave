    <title id="cs3-t">Repository contributor statistics strip</title>
    <desc id="cs3-d">Stats strip on a quantized topographic terrain: 43 stars, 7 forks
        and 1 contributor in Orbitron outlines cut as windows onto the terrain, and the
        Claude Code mark set directly on the field in its own brand orange with no
        socket, ring or keyline.</desc>
    <metadata>
        <hw:artifact id="01a02bd0-8e30-7902-9a41-73c6b95e02da" type="strip"
                     series="inneraura-identity" version="2.1.0">
            <hw:provenance>
                <hw:generator>Claude Opus 5 (InnerAura Labs) [claude-opus-5]
                </hw:generator>
                <hw:created>2026-08-21T00:00:00Z</hw:created>
                <hw:human-directed>true</hw:human-directed>
            </hw:provenance>
            <hw:lineage parent="01a02bb4-2a00-7802-8f99-6e83a71c1d99"
                        operation="glyph-embed"
                        donor="topographic-dither-matrix#1.4.0" />
            <hw:spec size="680x72" performance="composite-only" theme="light"
                     a11y="WCAG-AA" />
        </hw:artifact>
        <hw:aesthetic>
            <hw:chromatic system="topographic-dither-matrix" space="srgb"
                          contrast-ratio="&gt;9:1 numerals; attribution mark exempt as a logotype"
                          theory="quantized-ordered-dither with one out-of-genome attribution colour" />
            <hw:motion vocabulary="screen-march, level-set-step" physics="none"
                       timing="phi" cim-compliant="true" />
            <hw:geometry form-language="orthogonal" proportional-system="4px-matrix"
                         mathematical-basis="ordered-dither-lattice"
                         symmetry="translational" />
            <hw:material surface="quantized terrain under an ordered screen"
                         depth="shallow" />
        </hw:aesthetic>
        <hw:reasoning>
            <hw:intent>Set the Claude Code mark on the field as a mark, not as an avatar
                — flat brand orange, no socket, no ring, no keyline.</hw:intent>
            <hw:approach>The socket disc, its 15.5 ring and the knockout mask are all
                deleted; the glyph is a single filled path at #D97757 sitting directly
                on the terrain, sized up from 22 to 33.6px now that nothing frames it.
                That makes it the only element in the entire family painted outside the
                genome, which is the correct reading rather than an inconsistency —
                every other mark here is a window onto InnerAura&apos;s own terrain, and
                an attribution to somebody else&apos;s tool should not be dressed in
                InnerAura&apos;s palette. It is a citation, and citations keep their own
                typeface.</hw:approach>
            <hw:tradeoffs>Flat orange on a full-range terrain is weak by measurement and
                there is no version of this request that fixes it: #D97757 sits at 0.286
                relative luminance, almost exactly mid-scale, so it loses contrast at
                both ends of the terrain at once — 2.82:1 against mist at the top of the
                range and 1.21:1 where the drift carries a cobalt basin under it, which
                is the floor. Dropping the strip terrain from 0.62 to 0.30 opacity only
                lifts that floor to 1.92:1, so it is not a fix either, and the mark
                would still fade on the deepest bands. This ships as requested because
                WCAG 1.4.11 exempts logotypes from non-text contrast, so it is
                defensible, but it will visibly soften a few seconds out of every drift
                cycle and that is a real cost of the no-border decision rather than an
                oversight. Anything that would fix it — a keyline, a quiet zone, a
                darker orange — is the border that was asked to be removed. Thirty-six
                and seven remain hard-coded and will rot.</hw:tradeoffs>
            <hw:spatial-notes>680x72, rx6. Columns at x85, x255, x425, dividers at 170,
                340, 510. Labels 7px monospace at y22; numerals Orbitron wght 700 at
                20px, baseline y50. Claude Code mark from a 24-unit viewBox at scale
                1.4, origin (578.2,26.5), rendering 33.6 by 21 centred on (595,44) in
                flat #D97757. Terrain frequency 0.0039 0.0060; 4px screen
                unchanged.</hw:spatial-notes>
        </hw:reasoning>
        <hw:stratum>
            <hw:ring primary="002-TRIBE" />
            <hw:affinities>
                <hw:resonance ring="003-NATION" strength="0.4" />
            </hw:affinities>
        </hw:stratum>
    </metadata>
