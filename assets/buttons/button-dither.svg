    <style>
        svg {
            color-scheme: light;
        }

        .mar45 {
            will-change: transform;
            animation: mar45 11.09s steps(4) infinite;
        }

        .mar15 {
            will-change: transform;
            animation: mar15 6.854s steps(4) infinite;
        }

        .tide {
            animation: tide 21.4s steps(6) infinite;
        }

        @keyframes mar45 {
            to {
                transform: translate(2.828px, 2.828px);
            }
        }

        @keyframes mar15 {
            to {
                transform: translate(3.864px, 1.035px);
            }
        }

        @keyframes tide {

            0%,
            100% {
                opacity: 0.95;
            }

            50% {
                opacity: 0.45;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
            }
        }
    </style>
