<svg xmlns="http://www.w3.org/2000/svg" xmlns:hw="https://hyperweave.app/hw/v1.0"
     viewBox="0 0 260 80" width="260" height="80" role="img" aria-label="Return"
     aria-labelledby="btn-t btn-d" data-hw-component="button"
     data-hw-chromatic="topographic-dither-matrix" data-hw-state="idle"
     data-hw-status="active" data-protocol="hw-v1">
    <title id="btn-t">Return</title>
    <desc id="btn-d">Return button: the pill body and its border are both windows onto
        the same quantized terrain under a 4px ordered screen, the border showing the
        submerged palette and the label cut from it in Orbitron outlines.</desc>
    <metadata>
        <hw:artifact id="01a02b7c-4e10-7602-8b21-9d40c5f18e33" type="button"
                     series="inneraura-identity" version="1.0.0">
            <hw:provenance>
                <hw:generator>Claude Opus 5 (InnerAura Labs) [claude-opus-5]
                </hw:generator>
                <hw:created>2026-08-21T00:00:00Z</hw:created>
                <hw:human-directed>true</hw:human-directed>
            </hw:provenance>
            <hw:lineage parent="01a02b16-3d20-7302-8845-1e7c02b9d63f"
                        operation="dna-transplant"
                        donor="topographic-dither-matrix#1.4.0"
                        note="replaces the rotating-gradient liquid-surface button" />
            <hw:spec size="260x80" performance="composite-only" theme="light"
                     a11y="WCAG-AA" />
        </hw:artifact>
        <hw:aesthetic>
            <hw:chromatic system="topographic-dither-matrix" space="srgb"
                          contrast-ratio="&gt;7:1 label on body"
                          theory="quantized-ordered-dither — hard-edge level sets, anti-gradient" />
            <hw:motion vocabulary="screen-march, level-set-step" physics="none"
                       timing="phi" cim-compliant="true" />
            <hw:geometry form-language="orthogonal" proportional-system="4px-matrix"
                         mathematical-basis="ordered-dither-lattice"
                         symmetry="bilateral" />
            <hw:material surface="quantized terrain under an ordered screen"
                         depth="shallow" />
        </hw:aesthetic>
        <hw:reasoning>
            <hw:intent>Carry the approved DNA onto the Return button, replacing the
                rotating-gradient border the old one used.</hw:intent>
            <hw:approach>The predecessor&apos;s glow depended on a rotating linear
                gradient and three bloom filter chains, none of which survive an
                anti-gradient doctrine. The border is rebuilt as geometry instead of
                light: a 5px stroked pill is used as a mask, and the same terrain is
                rendered through it under the submerged LUT, so the border is a window
                onto the landscape rather than a lit edge. Body and border therefore
                show one continuous terrain at two depths, with the 45-degree screen
                inside the border and the 15-degree screen on the body so the two read
                as separately printed plates. The label is Orbitron outlines cut as a
                third window, keeping it the deepest mass on the artifact. Terrain
                frequency is re-derived for a 260px canvas to 0.0102 by 0.0157 while the
                4px screen stays fixed, the same rule the icons use.</hw:approach>
            <hw:tradeoffs>The old button glowed and this one does not — an anti-gradient
                DNA cannot produce bloom, so hover and focus states have to be signalled
                by something other than intensity, most likely by shifting the level-set
                intercept to raise the terrain rather than by lighting it. No state
                variants are included here: this is the idle state only, and
                data-hw-state is present but unused. Body terrain runs at 0.55 opacity
                so the label stays readable, which flattens the landscape inside the
                button relative to every other artifact in the family. The arrow is a
                live text glyph rather than an outline, so it will shift between
                platforms while the Orbitron label will not — a deliberate asymmetry to
                avoid embedding a second font, but it does mean the two marks age
                differently.</hw:tradeoffs>
            <hw:spatial-notes>Canvas 260x80. Body rect 18,18 224x44 rx10; border stroke
                pill 16,16 228x48 rx12 at stroke-width 5 used as mask. Label RETURN in
                Orbitron wght 700 at 15px with 0.26em tracking, centred x116 baseline
                y46, measured width 92.0. Arrow at x178.0 y47. Terrain overscan
                -40,-40,340x160.</hw:spatial-notes>
        </hw:reasoning>
        <hw:stratum>
            <hw:ring primary="002-TRIBE" />
            <hw:affinities>
                <hw:resonance ring="003-NATION" strength="0.4" />
            </hw:affinities>
        </hw:stratum>
    </metadata>
