    <hw:reasoning>
      <hw:intent>Compress the v4.5 identity material into an 260×80 action control without turning the button into a miniature loading indicator.</hw:intent>
      <hw:approach>Two low-frequency luminous tides enter from opposite sides, overlap briefly near the return glyph, then recede; the semantic 'out / back' motion is expressed as material pressure rather than orbiting dashes.</hw:approach>
      <hw:tradeoffs>The strongest semantic specimen of the set, but intentionally less uniform than the canonical caustic drift; asymmetry is concentrated around the icon to reinforce RETURN.</hw:tradeoffs>
      <hw:spatial-notes>Left tide origin x-40, right tide origin x300; overlap target x178; 4.236s base cycle with 0.382 phase offset; highlight never crosses the text fill.</hw:spatial-notes>
