    </radialGradient>

    <filter id="field-soft" x="-22%" y="-40%" width="144%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>

    <filter id="field-deep" x="-28%" y="-55%" width="156%" height="210%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5.8" result="b"/>
      <feColorMatrix in="b" type="saturate" values="1.35" result="s"/>
      <feMerge>
        <feMergeNode in="s"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="liquid-displace" x="-18%" y="-35%" width="136%" height="170%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".018 .055" numOctaves="1" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5.5" xChannelSelector="R" yChannelSelector="B"/>
    </filter>

    <mask id="ring-mask" maskUnits="userSpaceOnUse" x="8" y="8" width="244" height="64">
