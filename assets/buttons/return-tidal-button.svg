  <style>

    svg { color-scheme: light dark; overflow: visible; }

    .surface { fill: #000000; }
    .hairline { fill: none; stroke: rgba(116,190,255,.28); stroke-width: .85; }
    .frame { fill: none; stroke: rgba(88,152,255,.38); stroke-width: 1.15; }
    .word { fill: #F7FBFF; }
    .icon { fill: #8FD4FF; }
    .quiet { opacity: .74; }

    .word, .icon {
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    @media (prefers-color-scheme: light) {
      .surface { fill: #FFFFFF; }
      .hairline { stroke: rgba(19,52,105,.14); }
      .frame { stroke: rgba(31,88,168,.28); }
      .word { fill: #102B58; }
      .icon { fill: #1F58A8; }
      .dark-field { display: none; }
      .light-field { display: inline; }
    }

    @media (prefers-color-scheme: dark) {
      .light-field { display: none; }
      .dark-field { display: inline; }
    }

    @media (forced-colors: active) {
      .surface { fill: Canvas; }
      .word, .icon { fill: CanvasText; }
      .hairline, .frame { stroke: CanvasText; }
      .field, .glow, .specular { display: none !important; }
    }


    .tide-left, .tide-right {
      will-change: transform, opacity;
      transform-box: fill-box;
      transform-origin: center;
      animation: tide 4.236s cubic-bezier(.22,.72,.28,1) infinite;
    }
    .tide-right { animation-delay: -.382s; }

    @keyframes tide {
      0%, 100% { transform: translateX(var(--start)) scale(.82); opacity: .10; }
      38.2% { transform: translateX(var(--mid)) scale(1.06); opacity: .82; }
      61.8% { transform: translateX(var(--end)) scale(.96); opacity: .42; }
      82% { transform: translateX(var(--start)) scale(.82); opacity: .10; }
    }

    .return-spark {
      animation: spark 4.236s ease-in-out infinite;
      transform-origin: 179px 40px;
    }
    @keyframes spark {
      0%, 35%, 100% { opacity: 0; transform: scale(.72); }
      61.8% { opacity: .92; transform: scale(1); }
      74% { opacity: .16; transform: scale(1.18); }
    }

    @media (prefers-reduced-motion: reduce) {
      .tide-left, .tide-right, .return-spark { animation: none !important; }
      .tide-left, .tide-right { opacity: .20; transform: none; }
      .return-spark { opacity: .26; transform: none; }
    }

  </style>

  <g class="field" mask="url(#ring-mask)">
