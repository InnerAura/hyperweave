    <rect class="light-field" x="12" y="12" width="236" height="56" fill="#FFFFFF"/>

    <g class="dark-field">
      <ellipse class="tide-left" style="--start:-92px;--mid:44px;--end:70px"
               cx="74" cy="40" rx="92" ry="46" fill="url(#tide-a)" opacity=".58" filter="url(#field-deep)"/>
      <ellipse class="tide-right" style="--start:92px;--mid:-28px;--end:-52px"
               cx="188" cy="40" rx="88" ry="44" fill="url(#tide-b)" opacity=".42" filter="url(#field-deep)"/>
      <circle class="return-spark" cx="179" cy="40" r="24" fill="url(#caustic-blue)" filter="url(#field-soft)"/>
    </g>

    <g class="light-field">
      <ellipse class="tide-left" style="--start:-92px;--mid:44px;--end:70px"
               cx="74" cy="40" rx="92" ry="46" fill="url(#tide-a)" opacity=".26" filter="url(#field-soft)"/>
      <ellipse class="tide-right" style="--start:92px;--mid:-28px;--end:-52px"
               cx="188" cy="40" rx="88" ry="44" fill="url(#tide-b)" opacity=".16" filter="url(#field-soft)"/>
      <circle class="return-spark" cx="179" cy="40" r="22" fill="url(#caustic-blue)" opacity=".28"/>
    </g>
  </g>
  <rect class="frame" x="12" y="12" width="236" height="56" rx="16"/>


  <rect class="surface" x="18" y="18" width="224" height="44" rx="10"/>
  <rect class="hairline" x="21" y="21" width="218" height="38" rx="7"/>

  <text class="word" x="108" y="46"
        font-family="Inter, 'SF Pro Display', system-ui, sans-serif"
