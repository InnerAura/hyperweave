      <stop offset="0%" stop-color="#F2FCFF" stop-opacity=".98"/>
      <stop offset="18%" stop-color="#8DD5FF" stop-opacity=".82"/>
      <stop offset="48%" stop-color="#3E82E2" stop-opacity=".36"/>
      <stop offset="100%" stop-color="#173762" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tide-b">
      <stop offset="0%" stop-color="#E4EDFF" stop-opacity=".94"/>
