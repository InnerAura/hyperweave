  <title id="title">Return — Tidal Return</title>
  <desc id="desc">HyperWeave RETURN control, tidal-return motion specimen.</desc>

  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
             xmlns:dc="http://purl.org/dc/elements/1.1/"
