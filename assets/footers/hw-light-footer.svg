  <title id="t">HyperWeave</title>
  <desc id="d">
    HyperWeave footer banner, Primer porcelain colorway. Full-width hairline rule above a
    centered two-cell lockup: the octahedral brand glyph, a vertical hairline divider, and
    the HYPERWEAVE wordmark in tracked geometric caps. Transparent — light surfaces (README light, docs, print).
  </desc>
  <metadata>
    <hw:artifact id="0198c1b7-7a40-7c19-bd6e-hwbannerporcel" type="banner" series="hyperweave-identity" version="1.0.0">
      <hw:provenance>
        <hw:generator>Claude Opus 5 (InnerAura Labs) [claude-opus-5]</hw:generator>
        <hw:created>2026-08-26T00:00:00Z</hw:created>
        <hw:human-directed>true</hw:human-directed>
        <hw:lineage parent="0197f490-c108-72b1-9f20-hyperweaveglyphsolo" relation="composition"/>
      </hw:provenance>
      <hw:spec size="1200x200" performance="paint-ok" theme="light" a11y="WCAG-AA"/>
    </hw:artifact>
    <hw:aesthetic>
      <hw:chromatic system="primer-porcelain" space="srgb" contrast-ratio="6.8"/>
      <hw:motion vocabulary="pulse" physics="damped" timing="phi" cim-compliant="true"/>
      <hw:geometry form-language="geometric" proportional-system="root2" mathematical-basis="golden-ratio" symmetry="bilateral"/>
      <hw:material surface="glass" depth="shallow"/>
    </hw:aesthetic>
    <hw:reasoning>
      <hw:intent>
        Footer / masthead strip for README, docs and email: the mark and the name in one
        horizontal band that survives being scaled to whatever column hosts it.
      </hw:intent>
      <hw:approach>
        Two cells divided by a hairline, the table structure the spec was written in. Cell
        one is the solo glyph at scale 0.72 (115.2px span); cell two is HYPERWEAVE at 50px
        with 3px tracking (0.06em), outlined to paths from Orbitron SemiBold — the same
        face the stacked wordmark is drawn in, confirmed by matching the existing outlines
        against the family: ink width/cap 1.022 and stem/cap 0.1667 both land on the 600
        weight exactly. Eight unique glyphs serve ten placements via an atlas. The divider and the full-width rule
        both fade to transparent at their ends so the band has no hard edge to fight the
        page. Only the centre node animates (transform + opacity, CIM-clean); the glyph is
        otherwise a still composition, because a footer that moves on every scroll is a
        distraction rather than a signature.
      </hw:approach>
      <hw:tradeoffs>
        Set in Orbitron 600 rather than a substitute face: v1.0.0 shipped tracked Adventor
        caps because Orbitron was not resident, and a near-miss on the wordmark face is the
        one substitution a brand system cannot absorb. Tracking held to 0.06em rather than
        the 0.11em a grotesque would want — Orbitron is already wide, and further tracking
        dissolves the word into letters. Chose one divider over a full table rule set: more rules would
        turn an identity band into a UI chrome fragment. Chose to leave the tagline out
        entirely — the footer states who, the stacked lockup states what, and stacking both
        here would leave neither dominant. Kept the canvas at 1200x200 (6:1) with the
        lockup at 48% of width rather than filling the band, so the artifact can be dropped
        in at 100% width without the name overwhelming the column.
      </hw:tradeoffs>
      <hw:spatial-notes>
        1200x200 (6:1), bilateral about x=600. Lockup width 632.7 centred on x=600 (spans
        459.8 minus the glyph cell to 916.2); glyph cell 115.2 wide centred
        (341.2,104), divider at x=428.8 running 64px vertically, wordmark cap
        height 40.6 on baseline 104+20.3, both cells sharing the optical centreline
        y=104. Gutters are equal at 30px either side of the divider. Full-width rule at
        y=1.5 with a three-stop fade peaking at centre. Vertical rhythm 1.5 rule > 51 air >
        104 lockup > 44 base air; the heavier base margin sets the band on the content
        above it rather than floating it.
      </hw:spatial-notes>
    </hw:reasoning>
