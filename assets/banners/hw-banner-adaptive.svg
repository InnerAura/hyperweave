  <title id="hwTitle">HyperWeave — The artifact layer for agent-human representations.
  </title>
  <desc id="hwDesc">
    HyperWeave two-line block lockup: the octahedral transmitter glyph beside a stacked
    type block
    of the HYPERWEAVE wordmark in Orbitron SemiBold caps over the product tagline. The
    mark is
    scaled to the whole block rather than to the word. Primer Porcelain base for light
    surfaces,
    inverting to the Noctilucent Chrome treatment — dark chamber under an ice-to-indigo
    bevel — where
    prefers-color-scheme resolves. Transparent field, cropped to the ink.
  </desc>
