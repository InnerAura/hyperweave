    <hw:reasoning xmlns:hw="https://hyperweave.app/hw/v1.0">
      <hw:intent>
        The approved block composition with the subtitle removed and the mark left at
        the size it
        was drawn, plus a dark colorway mined from the noctilucent banner rather than
        invented.
      </hw:intent>
      <hw:approach>
        Two corrections. Size: v1.0.0 re-derived the mark from phi once the block
        collapsed to one
        line, which shrank it to 1.618 x cap and made the glyph a bullet beside the
        type. This build
        holds the mark at the block lockup's exact 149 units and cap 52, so the
        composition Eli
        approved is preserved verbatim and the ratio reads 2.87:1. The two files now
        overlay and the
        subtitle is the only difference between them. Chroma: the dark colorway was
        re-mined rather
        than re-invented. SIGMA on banner-01a02c9f4b007a16 recovered the ramp E8F2FF -
        6090E8 -
        1B245A on the -80,-80 to 80,80 diagonal, a flat 080C24 body at 75% and a flat
        1B245A chamber
        at 45%; SIGMA-R on the two raster crops corroborated it at measured confidence —
        bevel lit
        side 7F9DDF falling to 455C9E and 141940 at the base, node beads F2F6FE, chamber
        interior
        151B42. Those readings are carried as tokens: the diamond stays dark and the
        ring does the
        work, which is what makes the mark read as chrome rather than as a lamp.
        Wordmark is one
        compound path. Colour is entirely --dna-* roles with literal var() fallbacks;
        porcelain is
        the base, Chrome the override.
      </hw:approach>
      <hw:tradeoffs>
        Retired the Beacon treatment entirely rather than dimming it: filling the
        chamber with light
        inverted the material logic — the mark stopped being a machined object and
        became a lamp, and
        no amount of tuning the fill opacity would have recovered the bevel, because the
        bevel is a
        luminance ramp across the ring and a bright interior competes with it. Cost of
        the mined
        alternative is real: the ramp terminal 1B245A measures 1.33:1 against a plain
        dark host, so
        the lower-right arc of the ring genuinely falls into the ground. That is chrome
        behaviour and
        it is kept deliberately, with the 45% cobalt bloom carrying separation instead —
        but on a
        pure black surface the silhouette is a crescent, not a diamond, and a flat-ink
        variant should
        be cut for any placement where the full outline must survive. Dropping the
        tagline costs the
        artifact its proposition: this lockup says who, not what, so a README needs the
        sentence in
        markdown underneath or the block file instead. Base is porcelain
        rather than dark-first, inverting the Camo rule in the spec, because Camo
        renders the media
        query inert and this repository publishes on a light README — the base must be
        the surface
        actually shipped to. The cost is that a GitHub dark-theme reader sees porcelain
        unless the
        embed uses a picture element. Kept one composited pulse rather than compiling a
        static
        projection, so the file is never fully idle; cut a static build for print and
        email.
      </hw:tradeoffs>
      <hw:constraints-applied>cim-compliant, wcag-aa-gated, zero-js, zero-filter,
        zero-fbo, reduced-motion, forced-colors, href-only</hw:constraints-applied>
      <hw:spatial-notes>
        853.4x169.0 (5.05:1). Mark centred (84.52,84.52) at scale 0.8951; optical
        half-extent 74.52
        measured bead to bead, so the 10px crop is uniform on all four sides. Cap band
        spans
        y=58.52 to 110.52 and is centred on the mark's axis; wordmark cap 52 on baseline
        110.52, run
        648.4, tracking 0.06em. Gutter 36 from bead edge to the H. Mark 149 against cap
        52
        is 2.87:1, identical geometry to the block lockup. Intrinsic 820x162.4.
      </hw:spatial-notes>
    </hw:reasoning>
