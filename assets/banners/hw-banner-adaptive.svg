        --dna-glass-0: #1B245A73;
        --dna-glass-1: #1B245A73;
        --dna-glass-2: #1B245A73;
        --dna-rim-0: #FFFFFFF2;
        --dna-rim-1: #E8F2FF99;
        --dna-rim-2: #6090E84D;
        --dna-rim-3: #1B245AD9;
      }
    }

    .node-core {
      transform-box: fill-box;
      transform-origin: center;
      will-change: transform, opacity;
      animation: hw-pulse 3.236s cubic-bezier(.4, 0, .2, 1) infinite;
    }

    @keyframes hw-pulse {

      0%,
      100% {
        transform: scale(1);
        opacity: .9
      }

      50% {
        transform: scale(1.22);
        opacity: 1
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

    @media (forced-colors: active) {

      .wm,
      .node {
        fill: CanvasText
      }

      .wire,
      .rim {
        stroke: CanvasText
      }

      .veil {
        opacity: .15
      }
    }
  </style>
