  <title id="t">HyperWeave</title>
  <desc id="d">
    HyperWeave inline horizontal lockup, noctilucent-indigo-ice colorway — octahedral glyph, hairline
    divider and HYPERWEAVE in Orbitron SemiBold caps. Transparent field, cropped to the ink:
    for dark surfaces (#0D1117 through #000).
  </desc>
  <metadata>
    <hw:artifact id="0198c1f5-4a20-7b08-9c62-hwinlinenoctil" type="lockup" series="hyperweave-identity" version="1.0.0">
