    </hw:artifact>
    <hw:aesthetic>
      <hw:chromatic system="noctilucent-indigo-ice" space="srgb" measured-floor="5.3:1"/>
      <hw:motion vocabulary="pulse" physics="damped" timing="phi" duration-base="3.236s" cim-compliant="true"/>
      <hw:geometry form-language="geometric" proportional-system="root2" mathematical-basis="none" symmetry="bilateral"/>
      <hw:typography stack="Orbitron 600 (outlined)" hierarchy="44" delivery="path-atlas"/>
      <hw:material surface="glass" depth="shallow"/>
    </hw:aesthetic>
    <hw:reasoning>
      <hw:intent>
        The markdown-native lockup: a strip that can sit at the top of a README, in a docs page
        or in a Slack message without carrying a plate, a margin or a colour assumption with it.
      </hw:intent>
      <hw:approach>
        Cropped to the ink. The viewBox is the content bounding box plus a uniform 10px of air —
        774.3x165.7, 4.7:1 — measured off the extremes that actually exist: the node beads at
        (80+3.25)x0.875 = 72.8 from the glyph centre, and the wordmark run of 557.3. There is no
        empty band above or below, so the gap a reader sees under the embed is the host's line box,
        not padding shipped inside the file. Intrinsic size is declared at 620x132.7 rather than the
        viewBox, so a bare markdown embed lands at a readable strip instead of 774px of logo.
        Tagline and full-width rules are dropped — both add height, and height is the enemy of an
        inline mark. The vertical divider stays: it is what makes two cells read as one lockup.
      </hw:approach>
      <hw:tradeoffs>
        Transparent field means no contrast guarantee against an arbitrary host — this is the reason
        the pair exists, and why the noctilucent file must only be served to dark surfaces (#0D1117 through #000). Cropping to
        10px also removes the optical margin a logo normally sits in, so anything placed hard against
        it will crowd the beads; the margin is now the document's job, not the artifact's. Chose to
        keep the singularity pulse: it costs nothing at rest and it is the one signal that the mark is
        an artifact rather than a picture of one.
      </hw:tradeoffs>
      <hw:spatial-notes>
        774.3x165.7 (4.67:1), bilateral about y=82.8. Glyph cell 140 centred (80.0,82.8) at
        scale 0.875; optical extent 145.7 bead-to-bead. Divider x=178.0, 76px tall, 28px gutters
        either side. Wordmark cap 44 on baseline 104.8, run 557.3, centred x=485.6.
        Uniform 10px crop on all four sides.
      </hw:spatial-notes>
    </hw:reasoning>
    <hw:stratum>
      <hw:ring primary="002-TRIBE"/>
      <hw:affinities><hw:resonance ring="005-COSMIC" strength="0.6"/></hw:affinities>
