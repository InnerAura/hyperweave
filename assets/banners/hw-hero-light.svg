    <title id="hwl-t">HyperWeave — unframed hero, light v3.6</title>
    <desc id="hwl-d">Light-surface HyperWeave hero: whisper-quiet daylight caustics
        fading to near-white at the edges, sweep geometry glyph, clean top-lit ink
        wordmark, subtitle flush to the H.</desc>
    <metadata>
        <hw:artifact id="01a024b0-eb20-7f01-8b31-6f2a90c416b1" type="hero-banner"
                     series="hyperweave-identity" version="3.6.1-light">
            <hw:provenance>
                <hw:generator>Claude Fable 5 (InnerAura Labs) [claude-fable-5]
                </hw:generator>
                <hw:created>2026-08-20T00:00:00Z</hw:created>
                <hw:human-directed>true</hw:human-directed>
            </hw:provenance>
            <hw:lineage parent="01a02460-da10-7e01-8b31-6f2a90c416a1"
                        operation="type-cleanup+contrast-fix"
                        donor="cherenkov-ink-family"
                        geometry-donor="cushion-gem-window#0.1.0" />
            <hw:spec size="1200x300 fluid-width" performance="paint-ok" theme="light"
                     a11y="WCAG-AA" />
        </hw:artifact>
        <hw:aesthetic>
            <hw:chromatic system="cherenkov-ink" space="srgb"
                          contrast-ratio="ink-on-daylight &gt;8:1" />
            <hw:motion vocabulary="fluid-caustic-drift, field-pan, liquid-displacement, organic-breathe"
                       physics="laminar-quantum-flow" timing="phi"
                       cim-compliant="false" />
            <hw:geometry form-language="angular" proportional-system="bilateral"
                         mathematical-basis="octahedral-gem-network"
                         symmetry="bilateral" />
            <hw:material surface="whisper-daylight-caustics+flat-identity-lockup"
                         depth="shallow" />
        </hw:aesthetic>
        <hw:reasoning>
            <hw:intent>Readable first, atmospheric second: the light hero rebuilt so the
                lockup owns the surface and the water only whispers behind it.
            </hw:intent>
            <hw:approach>Three gate fixes. TEXT STREAK: the inverted reflection band was
                the same waistline defect in mirror image — retired entirely; the
                wordmark now carries a clean three-stop top-lit ink vertical (#2E7CFF to
                #0A2C6E) with no reflection band anywhere in the file. ICON: the mark
                now carries the exact wordmark DNA (the same three-stop top-lit ink
                vertical run through glyph space, core and halo in mid-ink) so mark and
                type read as one metal; previously it was the sweep identity candidate,
                which read as a second system beside the ink type. BLUE-ON-BLUE: field
                pulled to a whisper (substrate #EEF5FC, primary pass 0.30, shimmer 0.12)
                with the primary light orbit re-biased to the right half so peak caustic
                activity never sits under the lockup, and the lockup deepened to the ink
                end of the family. Vignette to opaque #FBFDFF, same zero-alpha edge law.
            </hw:approach>
            <hw:tradeoffs>The chrome-reflection concept is now formally
                dark-surface-only: on light it produced streaks twice, so the light
                system commits to flat-identity color instead of simulated metal — the
                two heroes are siblings by geometry and motion, not by material. Field
                this quiet reads as texture rather than subject; on light pages that is
                the correct hierarchy.</hw:tradeoffs>
            <hw:spatial-notes>1200x300 fluid, fully opaque, vignette to #FBFDFF (sides
                120, top/bottom 64). Approved lockup set unchanged: mark (128,146) scale
                0.98, wordmark translate(178.4,-711.6) scale 1.6 (H flush x240.4, cap
                104.4-187.6), subtitle x240.4 y246. Primary light orbit x 420-1020
                (right-biased); secondary unchanged.</hw:spatial-notes>
        </hw:reasoning>
        <hw:stratum>
            <hw:ring primary="002-TRIBE" />
            <hw:affinities>
                <hw:resonance ring="005-COSMIC" strength="0.7" />
            </hw:affinities>
        </hw:stratum>
    </metadata>
