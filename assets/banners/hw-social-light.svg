  <title id="t">HyperWeave — The artifact layer for agent-human representations.</title>
  <desc id="d">
    HyperWeave GitHub social card, primer-porcelain colorway, horizontal lockup. Octahedral brand glyph,
    HYPERWEAVE in Orbitron SemiBold caps and the product tagline on a 1280x640 2:1 card.
    Field: transparent — light surfaces.
  </desc>
  <metadata>
    <hw:artifact id="0198c1e2-9b60-7d31-a4f7-hwcard46396467" type="social-card" series="hyperweave-identity" version="1.0.0">
      <hw:provenance>
        <hw:generator>Claude Opus 5 (InnerAura Labs) [claude-opus-5]</hw:generator>
        <hw:created>2026-08-26T00:00:00Z</hw:created>
        <hw:human-directed>true</hw:human-directed>
        <hw:lineage parent="0198c1b7-7a40-7c19-bd6e-hwbannerporcel" relation="reformat"/>
      </hw:provenance>
      <hw:spec size="1280x640" performance="paint-ok" theme="light" a11y="WCAG-AA" platform="github-social-preview"/>
    </hw:artifact>
    <hw:aesthetic>
      <hw:chromatic system="primer-porcelain" space="srgb" contrast-ratio="9.1:1" measured-floor="5.5:1"/>
      <hw:motion vocabulary="pulse" physics="damped" timing="phi" duration-base="3.236s" cim-compliant="true"/>
      <hw:geometry form-language="geometric" proportional-system="root2" mathematical-basis="none" symmetry="bilateral"/>
      <hw:typography stack="Orbitron 600 (outlined), TeX Gyre Heros (outlined)" hierarchy="60/28" delivery="path-atlas"/>
      <hw:material surface="glass" depth="shallow"/>
    </hw:aesthetic>
    <hw:reasoning>
      <hw:intent>
        GitHub repository social preview at the platform's 1280x640 spec — the card that renders
        in link unfurls on GitHub, Slack, X and LinkedIn, and the same artifact reused as a README hero.
      </hw:intent>
      <hw:approach>
        Reformat, not rescale. The 1200x200 footer is a 6:1 strip whose composition is horizontal by
        necessity; a 2:1 card has vertical room, so the type scale is rebuilt for the new frame rather
        than the strip being stretched into it — cap height 36 -&gt; 60, glyph scale 0.72 -&gt; 1.3,
        and the tagline restored, since a preview card is read once by a stranger and must say what
        the thing is. Full-bleed hairlines at y=1.5 and y=638.5 bookend the field. Wordmark is Orbitron
        SemiBold outlined to a path atlas (8 glyphs, 10 placements); tagline is Heros outlined the same way.
      </hw:approach>
      <hw:tradeoffs>
        Chose 1280x640 over the strip's aspect because GitHub crops social previews to 2:1 and a 6:1
        banner arrives letterboxed with the lockup shrunk to illegibility. Note this file must be
        rasterised to PNG for Settings -&gt; Social preview, which does not accept SVG; the SVG remains
        the source of truth and the README hero. Kept the singularity pulse even though the PNG export
        freezes it, because the SVG is also embedded live. Left the field transparent rather than plating it, so the card inherits the host surface — the cost is that a PNG export needs an explicit background flag or it unfurls onto whatever the client composites against.
      </hw:tradeoffs>
      <hw:spatial-notes>
        1280x640 (2:1), bilateral about x=640. Horizontal two-cell lockup: glyph cell 208 centred (220.0,302), divider x=364.0 (96px), wordmark cap 60 on baseline 332.0 centred x=784.5, run 759.0. Lockup width 1048.0 (76% of canvas). Tagline baseline 418, run 630.3. Content block y 198-440, optical centre 319 against canvas centre 320.
      </hw:spatial-notes>
    </hw:reasoning>
    <hw:stratum>
