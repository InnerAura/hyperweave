    <title id="dpb-t">HyperWeave Banner — Dark Pearl, liquid frame</title>
    <desc id="dpb-d">
        HyperWeave GitHub banner in the moirage dark-pearl material: chrome wordmark
        with a lifted
        horizon band, sigil scaled to 1.95x cap height and locked to the cap-band axis,
        subtitle
        "The artifact layer for agent-human representations" flush to the H, liquid
        interference frame.
    </desc>
    <metadata>
        <hw:artifact id="01a02148-9f50-7d03-9c42-8f4ba2d63820" type="banner"
                     series="moirage-mercury" version="2.2.0">
            <hw:provenance>
                <hw:generator>Claude Fable 5 (InnerAura Labs) [claude-fable-5]
                </hw:generator>
                <hw:created>2026-08-20T00:00:00Z</hw:created>
                <hw:human-directed>true</hw:human-directed>
            </hw:provenance>
            <hw:lineage parent="01a02100-8e40-7d02-9c42-8f4ba2d63810"
                        operation="lockup-rebalance+horizon-fix"
                        donor="moirage_banner_dark_pearl#2.0.0"
                        structure-donor="github-banner#1200x300" />
            <hw:spec size="1200x300" performance="paint-ok" theme="dark"
                     a11y="WCAG-AA" />
        </hw:artifact>
        <hw:aesthetic>
            <hw:chromatic system="moirage-dark-pearl" space="srgb"
                          contrast-ratio="metal-on-substrate &gt;7:1" />
            <hw:motion vocabulary="specular-light-orbit, harmonic-dash-drift, breathe"
                       physics="orbital" timing="phi" cim-compliant="false" />
            <hw:geometry form-language="geometric" proportional-system="root2"
                         mathematical-basis="golden-ratio" symmetry="bilateral" />
            <hw:material surface="oil-slick-liquid-frame+whisper-field-interior"
                         depth="deep" />
        </hw:aesthetic>
        <hw:reasoning>
            <hw:intent>Rebalance the hero lockup so the sigil anchors the wordmark
                instead of trailing it, and restore mid-glyph continuity in the chrome
                type.</hw:intent>
            <hw:approach>Diagnosis of the dark line: the metalType horizon stops sat at
                #12111A across 48-52 percent — within 3 luminance points of the #0A0A12
                substrate — so every glyph split into two disconnected halves wherever
                the interior field ran dark. Fix: horizon lifted to #3A3848 with #66647A
                shoulders and tightened to a 47-53 percent band, keeping the chrome
                reflection while every band stays at least 4x substrate luminance. Sigil
                rescaled 0.58 to 0.90 (span 93 to 144 px, 1.95x cap height) and its
                center moved from y145 to y142 — the exact cap-band axis, fixing a
                hidden 12px misalignment that made the old size read even smaller.
                Wordmark up to 1.42 with the sigil-to-H gap set at 34px; subtitle flush
                to the rendered H edge at x236.</hw:approach>
            <hw:tradeoffs>Kept the horizon dark enough to still read as a reflection
                line rather than flattening the chrome to a plain vertical ramp — full
                removal was the safer legibility fix but it deletes the material's
                signature. Sigil at 1.95x cap height claims real presence; going past
                ~2.2x starts compressing the top and bottom air against the frame. Right
                side keeps 194px of open field on purpose — the liquid is the second
                subject.</hw:tradeoffs>
            <hw:spatial-notes>1200x300, panel 16,16 1168x268 rx16. Sigil center
                (130,142) scale 0.90, span x 58-202, y 70-214. Wordmark
                translate(181.4,-619.1) scale 1.42: H flush edge x236.4, right edge
                x990, cap band y 105.1-178.9 (center 142, shared with sigil), descender
                202.5. Subtitle x236.4 baseline y231. Horizon band occupies y ~139-145
                through the glyphs (47-53 percent of the 510-578 local
                ramp).</hw:spatial-notes>
        </hw:reasoning>
        <hw:stratum>
            <hw:ring primary="002-TRIBE" />
            <hw:affinities>
                <hw:resonance ring="005-COSMIC" strength="0.6" />
                <hw:resonance ring="006-EMERGENT" strength="0.4" />
            </hw:affinities>
        </hw:stratum>
    </metadata>
