[project]
name = "hyperweave"
dynamic = ["version"]
description = "Visual CLI for agents. Generate deterministic SVG diagrams, charts, and tables with embedded machine-readable metadata. Zero JavaScript. Renders anywhere markdown does."
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "InnerAura Labs" }]
readme = "README.md"
keywords = [
    "agent-memory",
    "agent-observability",
    "agent-visualization",
    "ai-agents",
    "architecture-diagram",
    "artifacts",
    "charts",
    "cli",
    "code-visualization",
    "data-visualization",
    "diagram",
    "diagram-as-code",
    "generative-ui",
    "markdown",
    "mcp",
    "mcp-server",
    "profile-readme",
    "svg",
    "svg-generator",
    "tables",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Multimedia :: Graphics",
    "Framework :: FastAPI",
    "Typing :: Typed",
]
# Core install (CLI + render engine). The compose / render / connector modules
# import none of fastapi / uvicorn / fastmcp — those live behind the optional
# extras below so `pip install hyperweave` stays lean for the badge/render use
# case. The HTTP server and MCP server are opt-in (`[serve]` / `[mcp]`).
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.15",
    "jinja2>=3.1",
    "httpx[http2]>=0.28",
    "pyyaml>=6.0",
    # Font subsetting (v0.3.7). Runtime — not dev-only — because
    # render/fonts.py imports fontTools at module top-level, which
    # executes on every receipt render. brotli is the WOFF2 codec
    # fontTools uses inside font.save(flavor="woff2") and must be
    # importable on every install (uv tool install, pip install, etc.).
    "fonttools>=4.62.1",
    "brotli>=1.2.0",
]

[project.optional-dependencies]
# HTTP server (`hyperweave serve`). serve/app.py is the only fastapi user.
serve = ["fastapi>=0.115", "uvicorn[standard]>=0.34"]
# MCP server (`hyperweave mcp`, stdio). mcp/server.py is the only fastmcp user.
mcp = ["fastmcp>=3.0"]
# Raster projections (png/webp). formats/raster.py is the only user; imports are
# lazy so a core install never loads them. resvg-py ships statically-bundled resvg
# (no system binary); pillow converts the png to webp.
raster = ["resvg-py>=0.3.3", "pillow>=11.0"]
# Convenience: both servers.
all = ["hyperweave[serve,mcp]"]

[project.urls]
Homepage = "https://hyperweave.app"
Documentation = "https://hyperweave.app/docs"
Repository = "https://github.com/InnerAura/hyperweave"
Issues = "https://github.com/InnerAura/hyperweave/issues"
Discord = "https://discord.gg/wVmcAZPQZ8"

[project.scripts]
hyperweave = "hyperweave.cli:app"
hw = "hyperweave.cli:app"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/hyperweave/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hyperweave"]

[dependency-groups]
dev = [
    # Runtime server extras — kept OUT of the core install (pyproject
    # [serve]/[mcp]) but installed for dev/CI so the full suite can test
    # serve/app.py + mcp/server.py via `uv run pytest`.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "fastmcp>=3.0",
    # Raster extra — kept OUT of the core install ([raster]) but installed for
    # dev/CI so the png/webp projection + font-bridge tests run under pytest.
    "resvg-py>=0.3.3",
    "pillow>=11.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-fastest>=0.0.12",
    "pytest-mock>=3.14",
    "pytest-pretty>=1.2",
    "pytest-randomly>=3.16",
    "pytest-sugar>=1.0",
    "pytest-xdist>=3.5",
    "ruff>=0.15",
    # Exact pin: ty is 0.0.x beta with no stability guarantee, and the gate's
    # rule set is calibrated against this build.
    "ty==0.0.75",
    "types-pyyaml>=6.0.12.20250915",
    "pre-commit>=4.0",
]

[tool.pytest.ini_options]
# "." puts the repo root on the path so `scripts.examples` — the gallery
# generators — is importable by the tests that guard them. testpaths keeps
# collection inside tests/ regardless.
addopts = [
    "-ra",
    "-vv",
    "-n=auto",
    "--durations=5",
    # "--fastest-mode=skip",
    # "--fastest-commit=main",
    # "--cov=hyperweave",
    # "--cov-append",
    # "--cov-branch",
    # "--cov-fail-under=80",
    # "--cov-report=term-missing:skip-covered",
    # "--cov-report=json:tests/.reports/coverage.json",
    "--strict-config",
    "--strict-markers"
]
markers = [
    "slow: marks tests as slow",
    "snapshot: visual regression",
    "live: network access (deselect with '-m \"not live\"')",
]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
# target-version is derived from project.requires-python.
line-length = 120
src = ["src"]
extend-exclude = ["v04"]

[tool.ruff.lint]
# `explicit-preview-rules` keeps preview opt-in per rule: PYI033 activates
# because it is named by code, while the ~449 other preview diagnostics stay
# off. ANN enforces the missing-annotation coverage ty has no rule for;
# ANN401 stays off because explicit `Any` is correct at dynamic JSON and
# framework boundaries.
preview = true
explicit-preview-rules = true
select = ["ANN", "B", "E", "F", "I", "PYI", "PYI033", "RUF", "SIM", "TCH", "UP", "W"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# ANN is scoped to the shipped package, matching the type gate's own scope.
"tests/**" = ["ANN"]
"scripts/**" = ["ANN"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.src]
include = ["src/hyperweave"]

[tool.ty.rules]
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return-statement = "error"

[tool.ty.terminal]
error-on-warning = true
